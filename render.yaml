services:
  - type: web
    name: gymtracker-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false        # la cargás manualmente en el dashboard de Render
      - key: NODE_ENV
        value: production
